[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ithamar"
version = "0.2.0"
description = "Indian bank statements, extracted and proven row by row against their own running balance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chintha Victor Isaac" }]
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
bench = ["reportlab>=4"]
dev = ["pytest>=8", "hypothesis>=6", "reportlab>=4", "ruff>=0.6"]

[project.scripts]
ithamar = "ithamar.cli:main"

[tool.setuptools.packages.find]
include = ["ithamar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
